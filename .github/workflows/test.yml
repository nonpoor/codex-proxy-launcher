name: Test launchers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: macOS route and shell tests
        run: ./tests/test-proxy-contract.zsh
      - name: PowerShell portable behavior
        shell: pwsh
        run: ./tests/test-windows.ps1
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./tests/test-windows.ps1
      - name: PowerShell 7
        shell: pwsh
        run: ./tests/test-windows.ps1
